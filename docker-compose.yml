services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-academy_crm}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"     # ← 로컬에서만 접근 (외부 개방 차단)
    volumes:
      - pgdata:/var/lib/postgresql/data     # ← 재시작해도 데이터 유지
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
