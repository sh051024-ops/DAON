spring.application.name=demo
# 실제 키는 환경변수로만 주입한다. 여기에 하드코딩하지 말 것.
#   PowerShell:  $env:OPENAI_API_KEY = "sk-..."
#   cmd:         set OPENAI_API_KEY=sk-...
openai.api.key=${OPENAI_API_KEY:}
openai.model=gpt-4o

spring.profiles.active=local
# DB_CLOSE_DELAY=-1 없이는 커넥션 풀이 잠깐이라도 0으로 떨어지는 순간
# 이름 있는 인메모리 H2 DB 자체가 사라진다 (자리 비운 사이 DB가 텅 비는 버그의 원인).
spring.datasource.url=jdbc:h2:mem:academy_crm;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed

