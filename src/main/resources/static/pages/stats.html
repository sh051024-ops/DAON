<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<script src="/js/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DAON EDU | 통계</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="/css/common.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script>
  if (typeof Chart === 'undefined') {
    document.write('<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"><\/script>');
  }
</script>
<style>
:root{
  --blue:#2F6FEB; --blue-soft:#EBF1FE;
  --pink:#E85D9E; --pink-soft:#FCEAF3;
  --green:#20B27A; --green-soft:#E6F8F0;
  --amber:#F5A623; --amber-soft:#FFF3E1;
  --red:#F0554F;   --red-soft:#FDEBEA;
  --purple:#9C6ADE;--purple-soft:#F2ECFC;
  --page-bg:#F5F7FB;
  --radius:14px;
}
:root[data-theme="dark"]{
  --blue-soft:var(--blue-bg);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--page-bg);color:var(--text-900);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}

/* ---------------- layout shell ----------------
   사이드바/상단바는 include.js가 실제 공통 파셜(/partials/sidebar.html,
   /partials/topbar.html)로 항상 교체하므로, 여기서 .sidebar/.topbar에
   대한 스타일을 따로 정의하지 않는다 — common.css가 이미 정한 폭/배경/
   다크모드/접기 동작(var(--sidebar-w), var(--surface) 등)을 여기서
   #fff·252px·80px 같은 값으로 다시 고정하면, 이 페이지에서만 다크모드가
   안 먹고 사이드바 접기도 안 되는 문제가 생긴다. */

/* 알림 / 프로필 드롭다운, 토스트 */
.dropdown-wrap{position:relative;}
.dropdown-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;box-shadow:0 8px 24px rgba(20,25,50,0.10);min-width:170px;padding:5px;
  z-index:50;display:none;}
.dropdown-menu.open{display:block;}
.dropdown-menu .item{padding:9px 11px;border-radius:7px;font-size:13.5px;color:var(--text-900);cursor:pointer;}
.dropdown-menu .item:hover{background:var(--page-bg);}
.dropdown-menu .notif-title{font-size:12px;color:var(--text-500);padding:5px 9px 2px;font-weight:700;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;
  padding:10px 17px;border-radius:9px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;}
.toast.show{opacity:1;}

/* 모달 (자세히보기 / 더보기) */
.modal-overlay{position:fixed;inset:0;background:rgba(20,25,50,0.45);display:none;
  align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--surface);border-radius:14px;padding:20px 22px;max-width:480px;width:100%;
  max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(20,25,50,0.25);}
.modal-box h4{margin:0 0 4px;font-size:16.5px;font-weight:800;color:var(--text-900);}
.modal-box .modal-sub{font-size:12.5px;color:var(--text-500);margin-bottom:16px;}
.modal-box .modal-section{margin-bottom:16px;}
.modal-box .modal-section:last-child{margin-bottom:0;}
.modal-box .modal-section h5{margin:0 0 7px;font-size:13.5px;font-weight:700;color:var(--text-900);}
.modal-box .modal-section p{margin:0;font-size:13px;color:var(--text-500);line-height:1.6;}
.modal-box table{width:100%;border-collapse:collapse;margin-top:6px;}
.modal-box table th,.modal-box table td{padding:7px 8px;font-size:12.5px;border-bottom:1px solid var(--border);text-align:left;}
.modal-box table th{color:var(--text-500);font-weight:700;}
.modal-close{margin-top:16px;width:100%;border:none;background:var(--blue-soft);color:var(--blue);
  font-weight:700;padding:10px;border-radius:9px;font-size:13.5px;}

/* .content는 common.css가 이미 padding/레이아웃을 정하므로 여기서 손대지 않는다 —
   이 파일의 <style>이 common.css 링크보다 뒤에 있어서, 같은 선택자를 쓰면
   common.css가 정상 로드된 뒤에도 이 값이 이겨서 다른 페이지와 여백이 달라진다. */

/* page head */
.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.page-head h1{font-size:23px;font-weight:800;letter-spacing:-0.02em;margin:0 0 6px;}
.page-head p{margin:0;font-size:13.5px;color:var(--text-500);}

/* layout grid: left charts + right sidebar column */
.layout-grid{display:grid;grid-template-columns:1fr 240px;gap:12px;align-items:start;min-width:0;}
.layout-grid > *{min-width:0;}

/* CSS Grid/Flex 자식은 기본적으로 min-width:auto 라서, 내부 콘텐츠(캔버스, 긴 텍스트 등)가
   배정된 칸보다 커지면 그 칸이 강제로 늘어나며 전체 레이아웃이 옆으로 밀려 늘어나는 현상이
   생깁니다. 아래 규칙으로 모든 grid/flex 자식의 최소 너비를 0으로 고정해 이를 방지합니다. */
.main, .content, .left-col, .right-col{min-width:0;}
.kpi-grid, .row-2, .row-3{min-width:0;}
.kpi-grid > *, .row-2 > *, .row-3 > *{min-width:0;}
.panel, .kpi-card{min-width:0;}
.chart-box{min-width:0;overflow:hidden;}
.chart-box canvas{max-width:100%;}

/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:16px 13px 14px;position:relative;overflow:hidden;display:flex;flex-direction:column;
  align-items:center;text-align:center;}
.kpi-card .top{display:flex;flex-direction:column;align-items:center;gap:8px;}
.kpi-card .label{font-size:13px;color:var(--text-500);font-weight:600;}
.kpi-card .icon-circle{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;}
.kpi-card .icon-circle .icon{width:26px;height:26px;}
.kpi-card .value{font-size:25px;font-weight:800;margin-top:9px;letter-spacing:-0.3px;}
.kpi-card .bottom-row{display:flex;justify-content:center;align-items:center;margin-top:6px;}
.kpi-card .delta{font-size:12px;font-weight:700;display:flex;align-items:center;gap:2px;}
.kpi-card .delta.up{color:var(--green);}
.kpi-card .delta.down{color:var(--red);}
.kpi-card .delta .note{color:var(--text-400);font-weight:500;margin-left:1px;}

/* generic panel */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.panel-head h3{font-size:15px;font-weight:700;margin:0;}
.panel-head .sub{font-size:12px;color:var(--text-500);}

.row-2{display:grid;grid-template-columns:0.85fr 1.15fr;gap:10px;margin-bottom:10px;}
.row-3{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:16px;margin-top:6px;}
.funnel-row{display:flex;align-items:center;gap:10px;}
.funnel-label{width:68px;font-size:13px;color:var(--text-500);flex-shrink:0;}
.funnel-bar-wrap{flex:1;background:var(--gray-bg);border-radius:7px;overflow:hidden;height:32px;}
.funnel-bar{height:100%;background:linear-gradient(90deg,var(--blue),#6E9BFB);border-radius:7px;
  display:flex;align-items:center;justify-content:flex-end;padding-right:10px;color:#fff;font-size:12.5px;font-weight:700;}
.funnel-count{width:52px;text-align:right;font-size:14px;font-weight:700;flex-shrink:0;}
.funnel-total{margin-top:16px;background:var(--blue-soft);border-radius:9px;padding:13px 14px;
  display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--text-500);}
.funnel-total b{color:var(--blue);font-size:15px;}

.chart-box{position:relative;height:145px;}
.chart-box.small{height:100px;}
.chart-box.tiny{height:96px;}
.chart-box.grown{height:262px;}
.chart-box.tall{height:190px;}
.chart-box.donut-lg{height:166px;}

/* row-3 (하단 4분할) 카드는 더 넉넉하게 */
.row-3 .panel{padding:16px 16px;}
.row-3 .panel-head{margin-bottom:14px;}

/* donut center label */
.risk-donut-wrap{position:relative;}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.donut-center .n{font-size:19px;font-weight:800;color:var(--text-900);}
.donut-center .p{font-size:13px;color:var(--text-500);}
.risk-legend{display:flex;flex-direction:column;gap:9px;margin-top:14px;font-size:13px;}
.risk-legend .item{display:flex;justify-content:space-between;align-items:center;}
.risk-legend .item .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.risk-legend.foot{font-size:11.5px;color:var(--text-400);margin-top:12px;line-height:1.5;}

/* right column panels */
.right-col{display:flex;flex-direction:column;gap:10px;}
.insight-card{border:1px solid var(--border);border-radius:10px;padding:9px 10px;margin-bottom:7px;}
.insight-card:last-child{margin-bottom:0;}
.insight-card .head{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-bottom:4px;}
.insight-card .head .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);flex-shrink:0;}
.insight-card p{margin:0;font-size:12px;color:var(--text-500);line-height:1.5;}
.insight-card .more{font-size:12px;color:var(--blue);font-weight:700;margin-top:5px;display:inline-block;cursor:pointer;}

.highlight-list{display:flex;flex-direction:column;gap:8px;}
.highlight-item{display:flex;align-items:center;gap:8px;}
.highlight-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.highlight-item .label{flex:1;font-size:13px;color:var(--text-500);}
.highlight-item .val{font-size:13.5px;font-weight:800;}

#highlightMoreBtn{cursor:pointer;}

.export-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--border);
  border-radius:9px;padding:10px 12px;font-size:13.5px;font-weight:600;color:var(--text-900);
  background:var(--surface);width:100%;margin-bottom:7px;}
.export-btn:last-child{margin-bottom:0;}
.export-btn .ico{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-size:10px;color:#fff;flex-shrink:0;}

@media(max-width:1200px){
  .layout-grid{grid-template-columns:1fr;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .row-2,.row-3{grid-template-columns:1fr;}
}
</style>
</head>
<body data-page="stats">
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>
<div class="app">
  <div data-include="/partials/sidebar.html"></div>
  <div class="main">
    <div data-include="/partials/topbar.html"></div>

    <main class="content">
      <div class="page-head">
        <div>
          <h1>통계</h1>
          <p>핵심 지표와 추이를 한눈에 파악하고, 데이터 기반 의사결정을 지원합니다.</p>
        </div>
      </div>

      <div class="layout-grid">
        <!-- ================= LEFT: main charts ================= -->
        <div class="left-col">

          <!-- KPI -->
          <div class="kpi-grid" id="kpiGrid"></div>

          <!-- Row 2 : funnel + trend -->
          <div class="row-2">
            <div class="panel">
              <div class="panel-head">
                <h3>등록 → 수료 → 취업 퍼널</h3>
                <span class="sub">전체 누적</span>
              </div>
              <div class="funnel" id="funnelBox"></div>
              <div class="funnel-total" id="funnelTotal"></div>
            </div>
            <div class="panel">
              <div class="panel-head">
                <h3>월별 신규 등록 및 국비지원 인원 추이</h3>
                <span class="sub">● 신규 등록 &nbsp; ● 국비지원</span>
              </div>
              <div class="chart-box tall"><canvas id="trendChart"></canvas></div>
            </div>
          </div>

          <!-- Row 3 : 4 panels -->
          <div class="row-3">
            <div class="panel">
              <div class="panel-head"><h3>과정별 취업률</h3><span class="sub">수료 기수</span></div>
              <div class="chart-box grown"><canvas id="courseRateChart"></canvas></div>
            </div>
            <div class="panel">
              <div class="panel-head"><h3>기수별 출석률 비교</h3><span class="sub">이번 ▪ 지난</span></div>
              <div class="chart-box grown"><canvas id="cohortAttChart"></canvas></div>
            </div>
            <div class="panel">
              <div class="panel-head"><h3>위험 학생 분포</h3><span class="sub">재원 기준</span></div>
              <div class="chart-box donut-lg risk-donut-wrap">
                <canvas id="riskChart"></canvas>
                <div class="donut-center" id="riskCenter"></div>
              </div>
              <div class="risk-legend" id="riskLegend"></div>
              <div class="risk-legend foot">*위험 학생 정의: 최근 출석률 75% 미만 (중위험 60~74% / 고위험 60% 미만)</div>
            </div>
            <div class="panel">
              <div class="panel-head"><h3>위험 전환 추이</h3><span class="sub">월별</span></div>
              <div class="chart-box grown"><canvas id="riskTrendChart"></canvas></div>
            </div>
          </div>

        </div>

        <!-- ================= RIGHT: insight / highlight / export ================= -->
        <div class="right-col">
          <div class="panel">
            <div class="panel-head"><h3>AI 인사이트</h3></div>
            <div id="insightBox"></div>
          </div>

          <div class="panel">
            <div class="panel-head"><h3>주간 하이라이트</h3><span class="sub" id="highlightMoreBtn">더보기 &rsaquo;</span></div>
            <div class="highlight-list" id="highlightBox"></div>
          </div>

          <div class="panel">
            <div class="panel-head"><h3>데이터 내보내기</h3></div>
            <button class="export-btn" id="csvBtn">
              <span class="ico" style="background:var(--green)">CSV</span> CSV 다운로드
            </button>
            <button class="export-btn" id="pdfBtn">
              <span class="ico" style="background:var(--red)">PDF</span> PDF 다운로드
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
/* ==========================================================================
   students.csv 기반 실제 계산값
   - 리드(상담) 단계, 전년도 동기 데이터, 실시간 위험 이력 등은 원본 CSV에
     존재하지 않아 아래처럼 CSV로 계산 가능한 "동등한 성격의 실제 지표"로
     대체했습니다 (모두 실제 집계값이며, 임의로 지어낸 수치는 없습니다).
   ========================================================================== */

const COLORS = {
  blue:'#2F6FEB', pink:'#E85D9E', green:'#20B27A', amber:'#F5A623',
  red:'#F0554F', purple:'#9C6ADE', gray:'#C9CEDC'
};

/* 다크모드에서도 차트 눈금/그리드가 보이도록 테마 토큰에서 색을 읽는다 */
const _cssTokens = getComputedStyle(document.documentElement);
const GRID_COLOR = (_cssTokens.getPropertyValue('--border') || '#F0F1F6').trim();
if (typeof Chart !== 'undefined') {
  Chart.defaults.color = (_cssTokens.getPropertyValue('--text-500') || '#8A8FA3').trim();
}

/* ---------------- 차트 인스턴스 관리 + 리사이즈 대응 ----------------
   문제: 창 크기를 늘였다 줄였다 하거나, 다른 탭/페이지로 갔다가 돌아오면
   canvas 컨테이너의 실제 크기가 0이 되었다가 Chart.js가 이를 인지하지
   못해 그래프가 사라진 채로 남는 경우가 있었습니다.
   해결: 모든 차트 인스턴스를 배열에 보관해두고, resize / visibilitychange /
   pageshow / 레이아웃 크기 변화(ResizeObserver) 시점마다 강제로
   chart.resize()를 호출해 항상 다시 그려지도록 했습니다. */
const chartInstances = [];

function safeChart(id, config){
  try{
    if (typeof Chart === 'undefined') throw new Error('Chart.js not loaded');
    const el = document.getElementById(id);
    if(!el) throw new Error('no canvas '+id);
    const chart = new Chart(el, config);
    chartInstances.push(chart);
    return chart;
  }catch(e){
    console.error('[stats] chart failed:', id, e);
    const el = document.getElementById(id);
    if (el && el.parentElement){
      el.parentElement.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#F0554F;font-size:12px;text-align:center;">차트 로드 실패</div>';
    }
    return null;
  }
}

function resizeAllCharts(){
  chartInstances.forEach(c=>{
    try{ if(c && typeof c.resize === 'function') c.resize(); }catch(e){}
  });
}

let resizeDebounce;
function scheduleResize(delay){
  clearTimeout(resizeDebounce);
  resizeDebounce = setTimeout(resizeAllCharts, delay || 120);
}

window.addEventListener('resize', ()=> scheduleResize(150));
window.addEventListener('pageshow', ()=> scheduleResize(50));
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') scheduleResize(50);
});

/* ---------------- KPI (4 cards) ---------------- */
/* 수강생 수: 재원 179명, 6월 대비 5월(직전 모집기) 대비 등록 규모 변화(+79%, 100→179)
   평균 출석률: 재원생 평균 78.9%, 5월(78.1%)→6월(80.3%) +2.2%p   *원본의 "등록전환율" 자리는
     실제 리드 데이터가 없어 동일한 톤의 실지표(평균 출석률)로 대체
   수료율: 전체 279명 중 수료 100명 = 35.8%
   취업률: 수료생 100명 중 취업완료 77명 = 77.0%, 이전 2개 기수(72.1%)→최근 2개 기수(80.7%) +8.6%p */
function renderKPI(){
  const cards = [
    {label:'수강생 수', icon:'i-people-fill', color:COLORS.blue, value:'179명', delta:79, unit:'%', note:'(+79명)'},
    {label:'평균 출석률', icon:'i-calendar-fill', color:COLORS.pink, value:'78.9%', delta:2.2, unit:'%p', note:'(5월→6월)'},
    {label:'수료율', icon:'i-grad-fill', color:COLORS.green, value:'35.8%', delta:null, unit:'', note:'(279명 중 100명)'},
    {label:'취업률', icon:'i-briefcase-fill', color:COLORS.amber, value:'77.0%', delta:8.6, unit:'%p', note:'(이전 기수 대비)'}
  ];
  const grid = document.getElementById('kpiGrid');
  grid.innerHTML = cards.map((c,i)=>{
    const up = c.delta===null ? true : c.delta>=0;
    const deltaHtml = c.delta===null ? `<span class="delta up">누적 집계 ${c.note}</span>`
      : `<span class="delta ${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(c.delta)}${c.unit} <span class="note">${c.note}</span></span>`;
    return `
      <div class="kpi-card">
        <div class="top">
          <div class="icon-circle" style="background:${c.color}1A;color:${c.color}"><span class="icon ${c.icon}"></span></div>
          <div class="label">${c.label}</div>
        </div>
        <div class="value">${c.value}</div>
        <div class="bottom-row">
          ${deltaHtml}
        </div>

/* ---------------- 모달 (자세히 보기 / 더보기 공용) ---------------- */
function openModal(title, sub, sections){
  const box = document.getElementById('modalBox');
  let html = `<h4>${title}</h4>`;
  if(sub) html += `<div class="modal-sub">${sub}</div>`;
  sections.forEach(sec=>{
    html += `<div class="modal-section"><h5>${sec.title}</h5>`;
    if(sec.table){
      html += `<table><thead><tr>${sec.table.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`;
      sec.table.rows.forEach(r=>{
        html += `<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`;
      });
      html += `</tbody></table>`;
    }
    if(sec.text) html += `<p>${sec.text}</p>`;
    html += `</div>`;
  });
  html += `<button class="modal-close" id="modalCloseBtn">닫기</button>`;
  box.innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
}
document.getElementById('modalOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'modalOverlay') closeModal();
});

/* ---------------- 사이드바 / 상단바 인터랙션 ---------------- */
function showToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=>t.classList.remove('show'), 1800);
}
